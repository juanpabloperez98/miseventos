# Development stack only: docker compose up --build
# Production uses docker-compose.prod.yml on its own (docker compose -f docker-compose.prod.yml ...).
# Never combine both files: this one publishes ports on every interface.
name: miseventos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - miseventos

  backend:
    build:
      context: ./back
    env_file:
      # Override with BACKEND_ENV_FILE to keep production settings outside the repository.
      - ${BACKEND_ENV_FILE:-./back/.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      # Development: source mounted for the Flask reloader.
      - ./back:/app
    depends_on:
      postgres:
        condition: service_healthy
    # Health check: defined in back/Dockerfile (GET /health).
    restart: unless-stopped
    networks:
      - miseventos

  frontend:
    build:
      context: ./front
      args:
        # Development bundle (apiUrl http://localhost:5000/api) and its origin in the CSP.
        ANGULAR_CONFIGURATION: development
        API_ORIGIN: http://localhost:5000
    environment:
      # Target of the Nginx /api/ reverse proxy (service name + internal port).
      BACKEND_UPSTREAM: http://backend:5000
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    # Health check: defined in front/Dockerfile (Nginx serves index.html).
    # No depends_on: Nginx serves the static app on its own and resolves the backend per request.
    restart: unless-stopped
    networks:
      - miseventos

networks:
  miseventos:
    driver: bridge

volumes:
  postgres_data:
