<label class="label" [for]="fieldId()">
  {{ label() }}
  @if (required()) {
    <span class="required" aria-hidden="true">*</span>
  }
</label>

@switch (type()) {
  @case ('textarea') {
    <textarea
      class="control"
      [id]="fieldId()"
      [formControl]="control()"
      [rows]="rows()"
      [attr.placeholder]="placeholder()"
      [attr.maxlength]="maxLength()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
    ></textarea>
  }
  @case ('select') {
    <select
      class="control"
      [id]="fieldId()"
      [formControl]="control()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
    >
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  }
  @case ('datetime') {
    <app-date-time-input
      [inputId]="fieldId()"
      [formControl]="control()"
      [min]="min()?.toString()"
      [max]="max()?.toString()"
      [required]="required()"
      [invalid]="!!errorMessage()"
      [describedBy]="describedBy()"
    />
  }
  @case ('number') {
    <input
      class="control"
      type="number"
      inputmode="numeric"
      [id]="fieldId()"
      [formControl]="control()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.placeholder]="placeholder()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
    />
  }
  @default {
    <input
      class="control"
      [type]="type()"
      [id]="fieldId()"
      [formControl]="control()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.maxlength]="maxLength()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
    />
  }
}

@if (hint()) {
  <p class="hint" [id]="hintId()">{{ hint() }}</p>
}
@if (errorMessage(); as message) {
  <p class="error" [id]="errorId()">{{ message }}</p>
}
